name: V17 Target Hot Values Windows Validation

on:
  push:
    branches: [vmangos-v17-target-hot-values]
  pull_request:
    branches: [vmangos-v16-cumulative]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Windows Visual Studio 2022 x64 RelWithDebInfo
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build pinned cURL dependency
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1
          git clone --branch curl-8_10_1 --depth 1 https://github.com/curl/curl.git "%RUNNER_TEMP%\vmangos-curl"
          if errorlevel 1 exit /b 1
          cd /d "%RUNNER_TEMP%\vmangos-curl"
          git checkout --detach 7eb8c048470ed2cc14dca75be9c1cdae7ac8498b
          if errorlevel 1 exit /b 1
          call buildconf.bat
          if errorlevel 1 exit /b 1
          cd winbuild
          nmake /f Makefile.vc mode=dll MACHINE=x64
          if errorlevel 1 exit /b 1
          cd ..\builds\libcurl-vc-x64-release-dll-ipv6-sspi-schannel
          mkdir "%GITHUB_WORKSPACE%\dep\windows\optional_dependencies\curl\lib"
          copy /y bin\libcurl.dll "%GITHUB_WORKSPACE%\dep\windows\optional_dependencies\curl\lib\"
          if errorlevel 1 exit /b 1
          copy /y lib\libcurl.lib "%GITHUB_WORKSPACE%\dep\windows\optional_dependencies\curl\lib\"
          if errorlevel 1 exit /b 1
          xcopy /e /i /y include "%GITHUB_WORKSPACE%\dep\windows\optional_dependencies\curl\include"
          if errorlevel 1 exit /b 1

      - name: Configure VMaNGOS
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_EXTRACTORS=0 -DENABLE_MAILSENDER=1 -DBUILD_WARNINGS_AS_ERROR=0 -DBUILD_PLAYERBOTS=1 -DSUPPORTED_CLIENT_BUILD=5875

      - name: Build mangosd RelWithDebInfo
        run: cmake --build build --config RelWithDebInfo --target mangosd --parallel 3

      - name: Build and run cumulative source tests
        shell: pwsh
        run: |
          cmake -S tests/playerbots -B build-tests -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-tests --config RelWithDebInfo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-tests -C RelWithDebInfo --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check source tests with AddressSanitizer
        shell: pwsh
        run: |
          cmake -S tests/playerbots -B build-tests-asan -G "Visual Studio 17 2022" -A x64 -DVMANGOS_TEST_ASAN=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-tests-asan --config RelWithDebInfo --target context_cache_test action_lists_test value_metadata_test grind_target_test --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-tests-asan -C RelWithDebInfo --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage application DLLs and validation evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Item -LiteralPath bin/RelWithDebInfo/mangosd.exe,bin/RelWithDebInfo/mangosd.pdb | Out-Null
          New-Item -ItemType Directory -Force -Path bin/RelWithDebInfo/runtime,bin/RelWithDebInfo/validation | Out-Null
          Copy-Item -LiteralPath dep/windows/lib/x64_release/libmySQL.dll,dep/windows/lib/x64_release/libeay32.dll,dep/windows/optional_dependencies/curl/lib/libcurl.dll -Destination bin/RelWithDebInfo/runtime
          Copy-Item -LiteralPath build-tests/Testing/Temporary/LastTest.log -Destination bin/RelWithDebInfo/validation/source-tests.log
          Copy-Item -LiteralPath build-tests-asan/Testing/Temporary/LastTest.log -Destination bin/RelWithDebInfo/validation/source-tests-asan.log
          Copy-Item -LiteralPath build-tests/grind_contracts.json -Destination bin/RelWithDebInfo/validation/grind-source-provenance.json
          Copy-Item -LiteralPath docs/V17_TARGET_HOT_VALUES.md -Destination bin/RelWithDebInfo/README_V17.md

      - name: Record build identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactRoot = (Resolve-Path bin/RelWithDebInfo).Path
          $files = Get-ChildItem $artifactRoot -Recurse -File | Where-Object { $_.Name -in @('mangosd.exe', 'mangosd.pdb') -or $_.Extension -eq '.dll' }
          $hashes = @($files | ForEach-Object { @{ path = [IO.Path]::GetRelativePath($artifactRoot, $_.FullName).Replace('\','/'); bytes = $_.Length; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash } })
          @{ commit = (git rev-parse HEAD); source_baseline = 'cea7ba955f5c0d57ff76d63e53f97f34b1d3ab4c'; client_build = 5875; configuration = 'RelWithDebInfo'; architecture = 'x64'; playerbots = $true; source_tests = '4/4'; asan_tests = '4/4'; files = $hashes; runtime_prerequisites = @('Microsoft Visual C++ 2015-2022 x64 runtime', 'Microsoft Visual C++ 2008 x64 CRT for the bundled libmySQL.dll') } | ConvertTo-Json -Depth 4 | Set-Content bin/RelWithDebInfo/build-info.json

      - name: Upload cumulative validation build
        uses: actions/upload-artifact@v4
        with:
          name: vmangos-v17-target-hot-values-windows-x64-relwithdebinfo
          path: |
            bin/RelWithDebInfo/mangosd.exe
            bin/RelWithDebInfo/mangosd.pdb
            bin/RelWithDebInfo/runtime/*.dll
            bin/RelWithDebInfo/validation/*
            bin/RelWithDebInfo/README_V17.md
            bin/RelWithDebInfo/build-info.json
          if-no-files-found: error
