name: V21 Player Presence Windows Validation

on:
  push:
    branches: [vmangos-v21-player-presence]
  pull_request:
    branches: [vmangos-v21-player-presence]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Windows Visual Studio 2022 x64 RelWithDebInfo
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare pinned runtime build tools and legacy CRT
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nasmZip = Join-Path $env:RUNNER_TEMP 'vmangos-nasm.zip'
          Invoke-WebRequest 'https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip' -OutFile $nasmZip
          if ((Get-FileHash $nasmZip -Algorithm SHA256).Hash -ne '3EE4782247BCB874378D02F7EAB4E294A84D3D15F3F6EE2DE2F47A46AA7226E6') { throw 'NASM hash mismatch' }
          $nasmRoot = Join-Path $env:RUNNER_TEMP 'vmangos-nasm'
          Expand-Archive -LiteralPath $nasmZip -DestinationPath $nasmRoot
          Join-Path $nasmRoot 'nasm-2.16.03' | Out-File $env:GITHUB_PATH -Append
          # Install only on this disposable CI host; the artifact states this prerequisite.
          $legacyCrt = Join-Path $env:RUNNER_TEMP 'vmangos-vcredist2008-x64.exe'
          Invoke-WebRequest 'https://download.microsoft.com/download/5/d/8/5d8c65cb-c849-4025-8e95-c3966cafd8ae/vcredist_x64.exe' -OutFile $legacyCrt
          if ((Get-FileHash $legacyCrt -Algorithm SHA256).Hash -ne 'C5E273A4A16AB4D5471E91C7477719A2F45DDADB76C7F98A38FA5074A6838654') { throw 'VC2008 runtime hash mismatch' }
          $install = Start-Process -FilePath $legacyCrt -ArgumentList '/q','/norestart' -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -notin @(0, 3010, 1638)) { throw "VC2008 runtime installation failed: $($install.ExitCode)" }

      - name: Build matching OpenSSL 3 runtime
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1
          git clone --branch openssl-3.0.14 --depth 1 https://github.com/openssl/openssl.git "%RUNNER_TEMP%\vmangos-openssl3"
          if errorlevel 1 exit /b 1
          cd /d "%RUNNER_TEMP%\vmangos-openssl3"
          git checkout --detach 9cff14fd97814baf8a9a07d8447960a64d616ada
          if errorlevel 1 exit /b 1
          perl Configure VC-WIN64A shared no-tests
          if errorlevel 1 exit /b 1
          nmake build_libs
          if errorlevel 1 exit /b 1

      - name: Build pinned cURL dependency
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1
          git clone --branch curl-8_10_1 --depth 1 https://github.com/curl/curl.git "%RUNNER_TEMP%\vmangos-curl"
          if errorlevel 1 exit /b 1
          cd /d "%RUNNER_TEMP%\vmangos-curl"
          git checkout --detach 7eb8c048470ed2cc14dca75be9c1cdae7ac8498b
          if errorlevel 1 exit /b 1
          call buildconf.bat
          if errorlevel 1 exit /b 1
          cd winbuild
          nmake /f Makefile.vc mode=dll MACHINE=x64
          if errorlevel 1 exit /b 1
          cd ..\builds\libcurl-vc-x64-release-dll-ipv6-sspi-schannel
          mkdir "%GITHUB_WORKSPACE%\dep\windows\optional_dependencies\curl\lib"
          copy /y bin\libcurl.dll "%GITHUB_WORKSPACE%\dep\windows\optional_dependencies\curl\lib\"
          if errorlevel 1 exit /b 1
          copy /y lib\libcurl.lib "%GITHUB_WORKSPACE%\dep\windows\optional_dependencies\curl\lib\"
          if errorlevel 1 exit /b 1
          xcopy /e /i /y include "%GITHUB_WORKSPACE%\dep\windows\optional_dependencies\curl\include"
          if errorlevel 1 exit /b 1

      - name: Configure VMaNGOS
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_EXTRACTORS=0 -DENABLE_MAILSENDER=1 -DBUILD_WARNINGS_AS_ERROR=0 -DBUILD_PLAYERBOTS=1 -DSUPPORTED_CLIENT_BUILD=5875

      - name: Build and run cumulative source tests
        shell: pwsh
        run: |
          cmake -S tests/playerbots -B build-tests -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-tests --config RelWithDebInfo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-tests -C RelWithDebInfo --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check source tests with AddressSanitizer
        shell: pwsh
        run: |
          cmake -S tests/playerbots -B build-tests-asan -G "Visual Studio 17 2022" -A x64 -DVMANGOS_TEST_ASAN=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-tests-asan --config RelWithDebInfo --target context_cache_test action_lists_test value_metadata_test grind_target_test --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-tests-asan -C RelWithDebInfo --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check production Value lookup and RTTI contracts
        shell: pwsh
        run: |
          cmake -S tests/playerbots/full_chain -B build-chain-audit -G "Visual Studio 17 2022" -A x64 -DAUDIT_CANDIDATE=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-chain-audit --config RelWithDebInfo --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build-chain-audit/RelWithDebInfo/full_chain_audit.exe --check > build-chain-audit/contracts.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check V17.1 versus V18 quest contracts
        shell: pwsh
        run: |
          cmake -S tests/playerbots/quest_audit -B build-quest-audit -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-quest-audit --config RelWithDebInfo --target quest_test --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-quest-audit -C RelWithDebInfo --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S tests/playerbots/quest_audit -B build-quest-asan -G "Visual Studio 17 2022" -A x64 -DQUEST_ASAN=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-quest-asan --config RelWithDebInfo --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-quest-asan -C RelWithDebInfo --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check V18 versus V19 PMO contracts and toggle regressions
        shell: pwsh
        run: |
          cmake -S tests/playerbots/pmo_audit -B build-pmo-audit -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-pmo-audit --config RelWithDebInfo --target pmo_test --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build-pmo-audit/RelWithDebInfo/pmo_test.exe --repro > build-pmo-audit/v18-defects.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-pmo-audit -C RelWithDebInfo --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S tests/playerbots/pmo_audit -B build-pmo-asan -G "Visual Studio 17 2022" -A x64 -DPMO_ASAN=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-pmo-asan --config RelWithDebInfo --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-pmo-asan -C RelWithDebInfo --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check V20 shared-value lifetime and reproduce V19 use-after-free
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($asan in @($false, $true)) {
            $buildDir = 'build-v20-shared' + $(if ($asan) { '-asan' } else { '' })
            $configureArgs = @('-S', 'tests/playerbots/v20_shared', '-B', $buildDir, '-G', 'Visual Studio 17 2022', '-A', 'x64')
            if ($asan) { $configureArgs += '-DSHARED_ASAN=ON' }
            cmake @configureArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cmake --build $buildDir --config RelWithDebInfo --parallel 2
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ctest --test-dir $buildDir -C RelWithDebInfo --output-on-failure -V
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Check V20 list consumers and PMO report contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $suites = @(
            @{ Name = 'checkvalues'; Source = 'v20_checkvalues'; Asan = 'CHECKVALUES_ASAN'; Target = 'checkvalues_audit' },
            @{ Name = 'targets'; Source = 'v20_targets'; Asan = 'TARGETS_ASAN'; Target = 'targets_audit' },
            @{ Name = 'pmo-report'; Source = 'v20_pmo'; Asan = 'V20_PMO_ASAN'; Target = 'v20_pmo_test' }
          )
          foreach ($suite in $suites) {
            foreach ($asan in @($false, $true)) {
              $buildDir = "build-v20-$($suite.Name)" + $(if ($asan) { '-asan' } else { '' })
              $configureArgs = @('-S', "tests/playerbots/$($suite.Source)", '-B', $buildDir, '-G', 'Visual Studio 17 2022', '-A', 'x64')
              if ($asan) { $configureArgs += "-D$($suite.Asan)=ON" }
              cmake @configureArgs
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              cmake --build $buildDir --config RelWithDebInfo --target $suite.Target --parallel 2
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              ctest --test-dir $buildDir -C RelWithDebInfo --output-on-failure -V
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              if (!$asan -and $suite.Name -in @('checkvalues', 'targets')) {
                & "$buildDir/RelWithDebInfo/$($suite.Target).exe" --allocations "$buildDir/allocations.csv"
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              }
            }
          }

      - name: Check V21 human presence, parity, lifecycle and operation counts
        shell: pwsh
        run: |
          foreach ($asan in @($false, $true)) {
            $dir = 'build-v21-presence' + $(if ($asan) { '-asan' } else { '' })
            cmake -S tests/playerbots/v21_presence -B $dir -G "Visual Studio 17 2022" -A x64 "-DPRESENCE_ASAN=$asan"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cmake --build $dir --config RelWithDebInfo --parallel 2
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ctest --test-dir $dir -C RelWithDebInfo --output-on-failure -V
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & build-v21-presence/RelWithDebInfo/presence_benchmark.exe > build-v21-presence/benchmark.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build mangosd RelWithDebInfo
        run: cmake --build build --config RelWithDebInfo --target mangosd --parallel 3

      - name: Stage application DLLs and validation evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Item -LiteralPath bin/RelWithDebInfo/mangosd.exe,bin/RelWithDebInfo/mangosd.pdb | Out-Null
          New-Item -ItemType Directory -Force -Path bin/RelWithDebInfo/runtime,bin/RelWithDebInfo/validation | Out-Null
          Copy-Item -LiteralPath dep/windows/lib/x64_release/libmySQL.dll,dep/windows/lib/x64_release/libeay32.dll,dep/windows/optional_dependencies/curl/lib/libcurl.dll -Destination bin/RelWithDebInfo/runtime
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/vmangos-openssl3/libssl-3-x64.dll","$env:RUNNER_TEMP/vmangos-openssl3/libcrypto-3-x64.dll" -Destination bin/RelWithDebInfo/runtime
          New-Item -ItemType Directory -Force -Path bin/RelWithDebInfo/licenses | Out-Null
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/vmangos-openssl3/LICENSE.txt" -Destination bin/RelWithDebInfo/licenses/OpenSSL-3-LICENSE.txt
          Copy-Item -LiteralPath build-tests/Testing/Temporary/LastTest.log -Destination bin/RelWithDebInfo/validation/source-tests.log
          Copy-Item -LiteralPath build-tests-asan/Testing/Temporary/LastTest.log -Destination bin/RelWithDebInfo/validation/source-tests-asan.log
          Copy-Item -LiteralPath build-tests/grind_contracts.json -Destination bin/RelWithDebInfo/validation/grind-source-provenance.json
          Copy-Item -LiteralPath docs/V18_QUEST_HOT_PATH.md -Destination bin/RelWithDebInfo/README_V18.md
          Copy-Item -LiteralPath docs/V19_PMO_OFF_FAST_PATH.md -Destination bin/RelWithDebInfo/README_V19.md
          Copy-Item -LiteralPath docs/V20_VALUE_ALLOCATION.md -Destination bin/RelWithDebInfo/README_V20.md
          Copy-Item -LiteralPath docs/V21_PLAYER_PRESENCE.md -Destination bin/RelWithDebInfo/README_V21.md
          Copy-Item -LiteralPath build-v21-presence/Testing/Temporary/LastTest.log -Destination bin/RelWithDebInfo/validation/v21-presence-tests.log
          Copy-Item -LiteralPath build-v21-presence-asan/Testing/Temporary/LastTest.log -Destination bin/RelWithDebInfo/validation/v21-presence-tests-asan.log
          Copy-Item -LiteralPath build-v21-presence/generated/provenance.json -Destination bin/RelWithDebInfo/validation/v21-source-provenance.json
          Copy-Item -LiteralPath build-v21-presence/generated/source-scope.json -Destination bin/RelWithDebInfo/validation/v21-source-scope.json
          Copy-Item -LiteralPath build-v21-presence/operations.csv -Destination bin/RelWithDebInfo/validation/v21-operations.csv
          Copy-Item -LiteralPath build-v21-presence/benchmark.csv -Destination bin/RelWithDebInfo/validation/v21-benchmark.csv
          Copy-Item -Path docs/validation/v21-* -Destination bin/RelWithDebInfo/validation
          Copy-Item -LiteralPath build-pmo-audit/Testing/Temporary/LastTest.log -Destination bin/RelWithDebInfo/validation/pmo-tests.log
          Copy-Item -LiteralPath build-pmo-asan/Testing/Temporary/LastTest.log -Destination bin/RelWithDebInfo/validation/pmo-tests-asan.log
          Copy-Item -LiteralPath build-pmo-audit/generated/provenance.json -Destination bin/RelWithDebInfo/validation/pmo-source-provenance.json
          Copy-Item -LiteralPath build-pmo-audit/generated/inventory.json -Destination bin/RelWithDebInfo/validation/pmo-callsite-inventory.json
          Copy-Item -LiteralPath build-pmo-audit/v18-defects.log -Destination bin/RelWithDebInfo/validation/pmo-v18-defects.log
          Copy-Item -Path docs/validation/v19-* -Destination bin/RelWithDebInfo/validation
          Copy-Item -LiteralPath docs/OPTIMIZATION_TODO.md -Destination bin/RelWithDebInfo/OPTIMIZATION_TODO.md
          Copy-Item -LiteralPath build-quest-audit/Testing/Temporary/LastTest.log -Destination bin/RelWithDebInfo/validation/quest-tests.log
          Copy-Item -LiteralPath build-quest-asan/Testing/Temporary/LastTest.log -Destination bin/RelWithDebInfo/validation/quest-tests-asan.log
          Copy-Item -LiteralPath build-quest-audit/generated/provenance.json -Destination bin/RelWithDebInfo/validation/quest-source-provenance.json
          Copy-Item -Path docs/validation/v18-* -Destination bin/RelWithDebInfo/validation
          Copy-Item -LiteralPath build-chain-audit/contracts.csv -Destination bin/RelWithDebInfo/validation/value-chain-contracts.csv
          Copy-Item -LiteralPath build-chain-audit/generated/provenance.json -Destination bin/RelWithDebInfo/validation/value-chain-provenance.json
          foreach ($suite in @('shared', 'checkvalues', 'targets', 'pmo-report')) {
            Copy-Item -LiteralPath "build-v20-$suite/Testing/Temporary/LastTest.log" -Destination "bin/RelWithDebInfo/validation/v20-$suite-tests.log"
            Copy-Item -LiteralPath "build-v20-$suite-asan/Testing/Temporary/LastTest.log" -Destination "bin/RelWithDebInfo/validation/v20-$suite-tests-asan.log"
            Copy-Item -LiteralPath "build-v20-$suite/generated/provenance.json" -Destination "bin/RelWithDebInfo/validation/v20-$suite-source-provenance.json"
          }
          Copy-Item -LiteralPath build-v20-shared-asan/v19-expected-uaf.log -Destination bin/RelWithDebInfo/validation/v20-shared-v19-expected-uaf.log
          Copy-Item -LiteralPath build-v20-pmo-report/generated/source-audit.json -Destination bin/RelWithDebInfo/validation/v20-pmo-repo-wide-source-audit.json
          Copy-Item -LiteralPath build-v20-checkvalues/allocations.csv -Destination bin/RelWithDebInfo/validation/v20-checkvalues-allocations.csv
          Copy-Item -LiteralPath build-v20-targets/allocations.csv -Destination bin/RelWithDebInfo/validation/v20-targets-allocations.csv
          # Preserve local measurements separately from fresh CI evidence.
          Get-ChildItem -Path docs/validation/v20-* -File | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path bin/RelWithDebInfo/validation ("local-" + $_.Name))
          }

      # IMPORTANT RUNTIME BOUNDARY: never execute mangosd (including --version),
      # WoW or a database. Only standalone test/benchmark programs run here.

      - name: Record build identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactRoot = (Resolve-Path bin/RelWithDebInfo).Path
          $files = Get-ChildItem $artifactRoot -Recurse -File | Where-Object { $_.Name -in @('mangosd.exe', 'mangosd.pdb') -or $_.Extension -eq '.dll' }
          $hashes = @($files | ForEach-Object { @{ path = [IO.Path]::GetRelativePath($artifactRoot, $_.FullName).Replace('\','/'); bytes = $_.Length; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash } })
          @{ commit = (git rev-parse HEAD); source_baseline = '169cb7712c8b704a3fe274cbf42a0cbb53fcb90a'; reference_v18 = 'fbab350b6cde7a40735d778986382807d6287048'; reference_v171 = '2ea64f9d27563ac410bacea79de6e2e2671b01c3'; fallback = 'cea7ba955f5c0d57ff76d63e53f97f34b1d3ab4c'; client_build = 5875; configuration = 'RelWithDebInfo'; architecture = 'x64'; playerbots = $true; source_tests = '4/4'; asan_tests = '4/4'; quest_tests = 'passed'; quest_asan_tests = 'passed'; pmo_tests = '5269 observations passed'; pmo_asan_tests = '5269 observations passed'; pmo_callsites = 47; v20_shared_tests = 'passed normal and ASan; expected V19 use-after-free independently reproduced'; v20_checkvalues_tests = '2560 observations passed normal and ASan'; v20_targets_tests = 'passed normal and ASan'; v20_pmo_report_tests = 'passed normal and ASan'; runtime_smoke = 'NOT RUN: explicit user runtime boundary'; v21_presence_tests = '51840 parity observations, lifecycle/category/camera/concurrency and intentional corrections: normal and ASan passed'; diagnostic_reference_only = '4b9d62de1c5dbe1398f5067596fa9111f00e2fdd'; openssl3_runtime = '3.0.14 / 9cff14fd97814baf8a9a07d8447960a64d616ada'; files = $hashes; runtime_prerequisites = @('Microsoft Visual C++ 2015-2022 x64 runtime', 'Microsoft Visual C++ 2008 x64 CRT for the bundled libmySQL.dll') } | ConvertTo-Json -Depth 4 | Set-Content bin/RelWithDebInfo/build-info.json

      - name: Upload cumulative validation build
        uses: actions/upload-artifact@v4
        with:
          name: vmangos-v21-player-presence-windows-x64-relwithdebinfo
          path: |
            bin/RelWithDebInfo/mangosd.exe
            bin/RelWithDebInfo/mangosd.pdb
            bin/RelWithDebInfo/runtime/*.dll
            bin/RelWithDebInfo/licenses/*
            bin/RelWithDebInfo/validation/*
            bin/RelWithDebInfo/README_V18.md
            bin/RelWithDebInfo/README_V19.md
            bin/RelWithDebInfo/README_V20.md
            bin/RelWithDebInfo/README_V21.md
            bin/RelWithDebInfo/OPTIMIZATION_TODO.md
            bin/RelWithDebInfo/build-info.json
          if-no-files-found: error
