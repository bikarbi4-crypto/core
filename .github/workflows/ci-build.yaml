name: V16 Windows Validation

on:
  push:
    branches:
      - vmangos-v16-cumulative-ci
  pull_request:
    branches:
      - vmangos-v16-cumulative

jobs:
  windows-msvc:
    name: Windows Visual Studio x64 RelWithDebInfo
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build cURL dependency
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/dep/windows/optional_dependencies"
          ./curl_download_and_build.bat

      - name: Configure VMaNGOS
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p build
          cd build
          cmake ../ \
            -DBUILD_EXTRACTORS=0 \
            -DENABLE_MAILSENDER=1 \
            -DBUILD_WARNINGS_AS_ERROR=0 \
            -DBUILD_PLAYERBOTS=1 \
            -DSUPPORTED_CLIENT_BUILD=5875 \
            -G "Visual Studio 17 2022" \
            -A x64

      - name: Build mangosd RelWithDebInfo
        shell: powershell
        run: |
          & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" "build\src\mangosd\mangosd.vcxproj" /p:Platform=x64 /p:Configuration=RelWithDebInfo /m

      - name: Show output files
        shell: powershell
        run: |
          Get-ChildItem -Path "bin\RelWithDebInfo" -File | Select-Object Name, Length, LastWriteTime

      - name: Upload mangosd validation build
        uses: actions/upload-artifact@v4
        with:
          name: vmangos-v16-cumulative-windows-x64-relwithdebinfo
          path: |
            bin/RelWithDebInfo/mangosd.exe
            bin/RelWithDebInfo/mangosd.pdb
          if-no-files-found: error
